<!doctype html>
<html lang="ru">
<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WS Chat — simple</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; padding: 20px; max-width: 800px; margin: auto; }
    .row { display:flex; gap:8px; margin-bottom:8px; }
    input, button, textarea { padding:8px; font-size:14px; }
    input[type="text"] { width:160px; }
    textarea { flex:1; height:80px; resize:vertical; }
    #log { border:1px solid #ddd; padding:8px; height:300px; overflow:auto; background:#fafafa; white-space:pre-wrap; }
    .meta { color:#666; font-size:12px; }
  </style>

</head>
<body>
  <h2>WebSocket Chat — Simple JSON sender</h2>

  <div class="row">
    <label>Sender ID: <input id="senderId" type="text" value="user1"></label>
    <label>Receiver ID: <input id="receiverId" type="text" placeholder="optional"></label>
    <label>Room ID: <input id="roomId" type="text" value="main"></label>
  </div>

  <div class="row">
    <textarea id="content" placeholder="Текст сообщения..."></textarea>

    <div style="display:flex;flex-direction:column;gap:8px;">
      <button id="sendBtn">Send</button>
      <button id="connectBtn">Connect</button>
      <button id="disconnectBtn">Disconnect</button>
    </div>
  </div>

  <div class="row">
    <input id="messageId" type="text" placeholder="optional message id">
    <label><input id="autoId" type="checkbox" checked> Auto-generate id</label>
  </div>

  <div class="meta">Endpoint: <code>ws://localhost:3000/ws</code> (не /ws/:id)</div>
  <h3>Log</h3>
  <div id="log"></div>

  <script>
    // --- Настройки ---
    const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.hostname + ':3000/ws';
    // если сервер на том же хосте/порту — можешь заменить на: const WS_URL = 'ws://localhost:3000/ws';

    const senderIdInput = document.getElementById('senderId');
    const receiverIdInput = document.getElementById('receiverId');

    const roomIdInput = document.getElementById('roomId');
    const contentInput = document.getElementById('content');
    const sendBtn = document.getElementById('sendBtn');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const logEl = document.getElementById('log');
    const messageIdInput = document.getElementById('messageId');
    const autoIdCheckbox = document.getElementById('autoId');

    let ws = null;

    function log(...args) {

      const time = new Date().toLocaleTimeString();
      logEl.textContent += `[${time}] ` + args.join(' ') + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    }

    function connect() {
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
        log('WebSocket: уже подключён или подключение в процессе');
        return;
      }

      ws = new WebSocket(WS_URL);

      ws.addEventListener('open', () => {
        log('WebSocket: connected to', WS_URL);
      });


      ws.addEventListener('message', (ev) => {
        // ожидаем, что сервер шлёт JSON
        try {
          const data = JSON.parse(ev.data);
          log('← received:', JSON.stringify(data));
        } catch (e) {
          log('← received (non-json):', ev.data);
        }

      });

      ws.addEventListener('close', (ev) => {
        log('WebSocket: disconnected', ev.code, ev.reason || '');
      });

      ws.addEventListener('error', (ev) => {
        log('WebSocket: error', ev);
      });
    }

    function disconnect() {

      if (!ws) return;
      ws.close();
      ws = null;
    }

    function genId() {
      // простая генерация id
      return Math.random().toString(36).slice(2, 10);
    }

    function sendMessage() {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        log('Ошибка: WebSocket не подключён. Нажми Connect.');
        return;
      }

      const senderId = senderIdInput.value.trim();
      const receiverId = receiverIdInput.value.trim();
      const roomId = roomIdInput.value.trim();
      const content = contentInput.value;

      if (!senderId) {
        log('Ошибка: укажи senderId');
        return;
      }
      if (!content) {
        log('Ошибка: пустое содержание сообщения');
        return;
      }

      const msg = {
        id: autoIdCheckbox.checked ? genId() : (messageIdInput.value.trim() || null),
        senderId: senderId,
        receiverId: receiverId || null, // null если не указан
        roomId: roomId || null,
        content: content,
        timestamp: Date.now()
      };

      const json = JSON.stringify(msg);
      ws.send(json);
      log('→ sent:', json);

      // очистить поле сообщения
      contentInput.value = '';
    }

    // кнопки
    sendBtn.addEventListener('click', sendMessage);
    connectBtn.addEventListener('click', connect);
    disconnectBtn.addEventListener('click', disconnect);


    // connect on load (по желанию)

    // connect();
  </script>
</body>
</html>
